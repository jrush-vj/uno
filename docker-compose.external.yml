# For hosts that ALREADY provide TLS (reverse proxy / Cloudflare Tunnel) and a
# TURN server. Runs only the game app and publishes port 8899.
services:
  uno:
    build: .
    image: uno-online:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8899"
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-3600}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_KEY: ${CLOUDFLARE_TURN_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Shared room registry. Leave unset to use the in-process fallback.
      REDIS_URL: ${REDIS_URL:-}
      CODE_TTL_SECONDS: ${CODE_TTL_SECONDS:-300}
      AFK_ROOM_SECONDS: ${AFK_ROOM_SECONDS:-120}
      MAX_ROOMS: ${MAX_ROOMS:-200}
      MAX_ROOMS_PER_CLIENT: ${MAX_ROOMS_PER_CLIENT:-3}
    ports:
      - "8899:8899"
    # Serve the app code straight off the host so edits go live without a
    # rebuild. Both paths are baked into the image, so both must be mounted.
    volumes:
      - ./static:/app/static:ro
      - ./server.py:/app/server.py:ro
      - ./store.py:/app/store.py:ro
      - ./store.py:/app/store.py:ro
